<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <a href="{{ url_for('admin_dashboard') }}" class="flex-shrink-0 flex items-center text-xl font-bold text-gray-800">
                        Admin Panel
                    </a>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="{{ url_for('admin_dashboard') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_dashboard' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="{{ url_for('admin_listed_items') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_listed_items' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Listed Items
                        </a>
                        <a href="{{ url_for('admin_users') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_users' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Users
                        </a>
                        <a href="{{ url_for('admin_assured_pending') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_assured_pending' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Assured Pending
                        </a>
                        <a href="{{ url_for('admin_orders_placed') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_orders_placed' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Orders Placed
                        </a>
                        <a href="{{ url_for('admin_misc_approvals') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_misc_approvals' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Misc Approvals
                        </a>
                        <a href="{{ url_for('admin_delivered_products') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'admin_delivered_products' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Delivered Products
                        </a>
                        <a href="{{ url_for('logout') }}" class="border-b-2 {{ 'border-indigo-500 text-indigo-600' if request.endpoint == 'logout' else 'border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700' }} inline-flex items-center px-1 pt-1 text-sm font-medium">
                            Logout
                        </a>
                    </div>
                </div>
                <div class="-mr-2 flex items-center sm:hidden">
                    <button type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500" aria-controls="mobile-menu" aria-expanded="false" onclick="toggleMenu()">
                        <span class="sr-only">Open main menu</span>
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div class="hidden sm:hidden" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1">
                <a href="{{ url_for('admin_dashboard') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_dashboard' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Dashboard
                </a>
                <a href="{{ url_for('admin_listed_items') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_listed_items' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Listed Items
                </a>
                <a href="{{ url_for('admin_users') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_users' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Users
                </a>
                <a href="{{ url_for('admin_assured_pending') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_assured_pending' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Assured Pending
                </a>
                <a href="{{ url_for('admin_orders_placed') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_orders_placed' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Orders Placed
                </a>
                <a href="{{ url_for('admin_misc_approvals') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_misc_approvals' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Misc Approvals
                </a>
                <a href="{{ url_for('admin_delivered_products') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'admin_delivered_products' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Delivered Products
                </a>
                <a href="{{ url_for('logout') }}" class="block pl-3 pr-4 py-2 border-l-4 {{ 'border-indigo-500 bg-indigo-50 text-indigo-700' if request.endpoint == 'logout' else 'border-transparent text-gray-500 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-700' }} text-base font-medium">
                    Logout
                </a>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        {% block content %}
        {% endblock %}
    </main>
    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
